<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_page</title>
    <meta name="description" content="Login page for the application.">
    <meta name="author" content="Abdul Rehman">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <div class="left">
            <h1>Welcome Back!!</h1>
            <p class="label-email">Email</p>
            <p class="label-password">Password</p>
            <img src="img/eye-closed.svg" alt="closed-eyes" class="eye" height="30px" width="auto">
            <div class="inputs">
                <input type="text" required class="email" id="email" placeholder="email@gmail.com" autocomplete="off">
                <p class="error-message" id="email-error"></p>

                <input type="password" required class="password" id="password" placeholder="Enter your password">
                <p class="error-message" id="password-error"></p>
            </div>
            <div class="forgot-div">
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" id="login-button">Login</button>
            <p class="or">- or -</p>
            <div class="social-links">
                <a href="#" class="google"><img src="img/Google Icon.svg" alt="google"></a>
                <a href="#" class="facebook"><img src="img/facebook Icon.svg" alt="facebook"></a>
                <a href="#" class="apple"><img src="img/Apple Icon.svg" alt="apple"></a>
            </div>
            <p class="no-account">Don't have an account?
                <a href="./signup.html" class="sign-up">Sign-up</a>
            </p>
        </div>
        <div class="right">
            <div class="right-container1"></div>
            <div class="right-container2"></div>
            <img src="img/young man sitting in front of laptop.svg" alt="login-img" class="right-img">
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let eye = document.querySelector('.eye');
            let password = document.querySelector('.password');

            eye.addEventListener("click", function (e) {
                e.preventDefault();
                if (password.type === "password") {
                    password.type = "text";
                    eye.src = "img/eye-open.svg";
                    eye.alt = "open-eyes";
                } else {
                    password.type = "password";
                    eye.src = "img/eye-closed.svg";
                    eye.alt = "closed-eyes";
                }
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');
        const loginButton = document.getElementById('login-button');

        loginButton.addEventListener('click', function (e) {
            e.preventDefault(); // Prevent form submission

            let isValid = true;

            // Email validation
            const emailValue = emailInput.value;
            if (emailValue === '') {
                emailError.textContent = 'Email is required.';
                emailError.style.display = 'block';
                isValid = false;
            } else if (!emailValue.includes('@')) {
                emailError.textContent = 'Email must include "@"  symbol';
                emailError.style.display = 'block';
                isValid = false;
            } else if ( !emailValue.endsWith('.com')) {
                emailError.textContent = 'Email must be end with ".com" statement';
                emailError.style.display = 'block';
                isValid = false;
            }else {
                emailError.style.display = 'none';
            }

            // Password validation
            const passwordValue = passwordInput.value;
            const hasNumber = /\d/.test(passwordValue);
            const hasUppercase = /[A-Z]/.test(passwordValue);
            const hasLetter = /[a-z]/.test(passwordValue);
            const isNotAllNumbers = /\D/.test(passwordValue);

            if (passwordValue === '') {
                passwordError.textContent = 'password is required.';
                passwordError.style.display = 'block';
                isValid = false;
            } else if (!passwordValue == hasNumber) {
                passwordError.textContent = 'Password must contain at least one number';
                passwordError.style.display = 'block';
                isValid = false;
            } else if (!passwordValue == hasUppercase) {
                passwordError.textContent = 'Password must contain at least one uppercase apphabet';
                passwordError.style.display = 'block';
                isValid = false;
            } else if (!passwordValue == hasLetter) {
                passwordError.textContent = 'Password must contain at least one lower-case alphabet';
                passwordError.style.display = 'block';
                isValid = false;
            } else if (!passwordValue == isNotAllNumbers) {
                passwordError.textContent = 'Password must not be all numbers';
                passwordError.style.display = 'block';
                isValid = false;
            } else {
                passwordError.style.display = 'block';
             }

            // If all validations pass, submit the form
            if (isValid) {
                const userData = [emailValue, passwordValue]; // Store email and password in an array
                console.log('User Data:', userData); // Log the array to the console
                alert('Form submitted successfully!');
            }
        });
    });
    </script>
</body>

</html>
